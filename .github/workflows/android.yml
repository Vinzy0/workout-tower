# Builds the Android app (Capacitor) on every push to main and publishes it as
# https://github.com/<owner>/<repo>/releases/download/apk/Tower.apk
name: Build Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'apk'
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Build web app (base "/")
        run: npm run build
      - name: Copy into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Tower.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --prerelease --title "Tower for Android (latest build)" \
            --notes "Debug build of the latest main. Install: download Tower.apk on your phone, open it, allow installing from this source."
          gh release upload apk Tower.apk --clobber
